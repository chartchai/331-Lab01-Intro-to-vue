<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Intro SE331</title>
    <!-- Import Styles -->
    <link rel="stylesheet" href="./assets/styles.css" />
    <!-- Import Vue.js -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>
    <div id="app">
    <div class="nav-bar"></div>
    <div class="cart">cart ({{ cart }})</div>
    <div class="product-display">
        <div class="product-container">
            <div class="product-image">
                <!--image-->
                <img :src="image" :class="{'out-of-stock-img': inventory === 0}"> <!--7.6-->
            </div>
        </div>
    </div>
    <div class="product-info">
        
        <a :href="productLink"> <!-- 3.6 -->
           <!-- <h1>{{brand + ' ' + product}}</h1>  -->
            <h1>{{ title }}</h1>
        </a>
        <p v-if="inventory > 10">In Stock</p>
        <p v-else-if="inventory <= 10 && inventory > 0">Almost out of Stock</p>
        <p v-else>Out of stock</p>
        <ul>
            <li v-for="detail in detail"> {{ detail }} </li>
        </ul>
        <div v-for="(variant ,index) in variants" :key="variant.id" @mouseover="updateVariant(index)" class="color-circle" :style="{backgroundColor: variant.color}">
            {{variant.color}}
        </div>
        <button class="button" :disabled='!inStock' @click="addToCart" :class='{disabledButton: !inStock}'>Add To Cart</button>

         <button class="button" @click="StockStatus">In Stock</button> <!-- 6.7 -->
        <p>{{ description }}</p> <!-- 2.5 -->

        <p v-if="onSale">{{ brand + ' ' + product + ' is on sale' }}</p> <!--8.5-->
        <p v-else>Not on Sale</p>

        <!--5.5-->
        <p>Sizes: <span v-for="size in sizes" :key="size">{{ size }}</span> </p>
        
    </div>

    </div>

    <!-- Import Js -->
    <script src="./main.js"></script>
</body>

</html>
